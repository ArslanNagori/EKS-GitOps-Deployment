<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="EKS GitOps DevSecOps Platform">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101c3a"/>
      <stop offset="1" stop-color="#1b1140"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9900"/>
      <stop offset="1" stop-color="#ff5e7e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="18" fill="url(#glow)"/>
  <!-- decorative network -->
  <g stroke="#3b4d7a" stroke-width="1.4" opacity="0.7" transform="translate(80,0)">
    <line x1="960" y1="70" x2="1060" y2="140"/><line x1="1060" y1="140" x2="1170" y2="90"/>
    <line x1="1060" y1="140" x2="1010" y2="250"/><line x1="1010" y1="250" x2="1140" y2="270"/>
    <line x1="1140" y1="270" x2="1170" y2="90"/><line x1="960" y1="70" x2="1010" y2="250"/>
  </g>
  <g transform="translate(80,0)">
    <circle cx="960" cy="70" r="9" fill="#ff9900"/><circle cx="1060" cy="140" r="12" fill="#58a6ff"/>
    <circle cx="1170" cy="90" r="8" fill="#3fb950"/><circle cx="1010" cy="250" r="9" fill="#a371f7"/>
    <circle cx="1140" cy="270" r="11" fill="#ff5e7e"/>
  </g>
  <rect x="64" y="64" width="86" height="6" rx="3" fill="url(#accent)"/>
  <text x="64" y="128" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="48" font-weight="800" fill="#ffffff">EKS GitOps DevSecOps Platform</text>
  <text x="64" y="172" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="24" fill="#a9b8d9">Jenkins CI/CD  →  ArgoCD GitOps  →  Amazon EKS  →  Prometheus &amp; Grafana</text>
  <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="600">
    <rect x="64" y="214" width="92" height="36" rx="18" fill="#ff9900" fill-opacity="0.16" stroke="#ff9900"/><text x="110" y="238" text-anchor="middle" fill="#ffb84d">AWS EKS</text>
    <rect x="168" y="214" width="112" height="36" rx="18" fill="#58a6ff" fill-opacity="0.16" stroke="#58a6ff"/><text x="224" y="238" text-anchor="middle" fill="#8cc4ff">Kubernetes</text>
    <rect x="292" width="92" height="36" rx="18" fill="#ff7a59" fill-opacity="0.16" stroke="#ff7a59"/><text x="338" y="238" text-anchor="middle" fill="#ffa58f">ArgoCD</text>
    <rect x="396" width="92" height="36" rx="18" fill="#f0d24b" fill-opacity="0.14" stroke="#f0d24b"/><text x="442" y="238" text-anchor="middle" fill="#f5e07a">Jenkins</text>
    <rect x="500" width="82" height="36" rx="18" fill="#3fb950" fill-opacity="0.16" stroke="#3fb950"/><text x="541" y="238" text-anchor="middle" fill="#7ee08f">Trivy</text>
    <rect x="594" width="106" height="36" rx="18" fill="#a371f7" fill-opacity="0.16" stroke="#a371f7"/><text x="647" y="238" text-anchor="middle" fill="#c7a6ff">SonarQube</text>
    <rect x="712" width="116" height="36" rx="18" fill="#ff5e7e" fill-opacity="0.16" stroke="#ff5e7e"/><text x="770" y="238" text-anchor="middle" fill="#ff93a8">Prometheus</text>
    <rect x="840" width="84" height="36" rx="18" fill="#ff9900" fill-opacity="0.16" stroke="#ff9900"/><text x="882" y="238" text-anchor="middle" fill="#ffb84d">Grafana</text>
  </g>
  <text x="64" y="300" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="17" fill="#7f8fb3">3-tier Wanderlust app  ·  2-node managed node group  ·  Git as the single source of truth</text>
</svg>
